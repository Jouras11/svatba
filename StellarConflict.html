<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STELLAR CONFLICT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810; --panel:#0a0e1a; --border:#1a2035; --text:#c8d8f0; --muted:#4a6080;
  --attack:#ff4444; --sabotage:#00ccff; --tower:#ff8800; --shield:#ffcc00;
  --prod:#aa55ff; --special:#ff44aa; --trade:#00ffaa;
  --glow:0 0 18px rgba(0,170,255,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-size:13px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 8% 12%,#fff,transparent),
    radial-gradient(1px 1px at 22% 45%,#aef,transparent),
    radial-gradient(1px 1px at 38% 72%,#fff,transparent),
    radial-gradient(1px 1px at 54% 18%,#ffa,transparent),
    radial-gradient(1px 1px at 68% 88%,#fff,transparent),
    radial-gradient(1px 1px at 82% 52%,#aff,transparent),
    radial-gradient(1px 1px at 91% 33%,#fff,transparent),
    radial-gradient(1px 1px at 4%  77%,#fff,transparent),
    radial-gradient(1px 1px at 30% 8%, #fff,transparent),
    radial-gradient(1px 1px at 75% 25%,#fff,transparent),
    radial-gradient(2px 2px at 80% 10%,rgba(0,170,255,.5),transparent),
    radial-gradient(2px 2px at 15% 60%,rgba(255,100,0,.4),transparent);
}
#app{position:relative;z-index:1;display:grid;grid-template-rows:44px 1fr auto 48px;height:100vh;gap:4px;padding:4px 6px}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(0,50,100,.5),rgba(10,14,26,.8) 50%,rgba(80,10,0,.5))}
.hdr-side{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:3px}
.hdr-side.blue{color:#00aaff} .hdr-side.red{color:#ff4444}
.hdr-center{text-align:center}
h1{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:900;letter-spacing:5px;
  background:linear-gradient(90deg,#00aaff,#fff,#ff4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#round-label{font-family:'Orbitron',monospace;font-size:.52rem;letter-spacing:2px;color:var(--muted)}

/* BATTLEFIELD */
#battlefield{display:grid;grid-template-columns:1fr 180px 1fr;gap:4px;min-height:0}

/* SHIP PANELS */
.player-panel{background:var(--panel);border-radius:8px;border:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.player-panel.human{border-color:#1a3a5a}
.player-panel.ai{border-color:#3a1a1a}
.ship-name{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:3px;padding:3px 8px;flex-shrink:0}
.player-panel.human .ship-name{color:#00aaff;background:linear-gradient(90deg,rgba(0,100,200,.2),transparent);border-bottom:1px solid #1a3a5a}
.player-panel.ai    .ship-name{color:#ff4444;background:linear-gradient(90deg,rgba(180,0,0,.2),transparent);border-bottom:1px solid #3a1a1a;text-align:right}

.ship-img-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;min-height:0}
.ship-img{width:100%;height:100%;object-fit:cover;object-position:center;
  opacity:.85;filter:saturate(1.2) contrast(1.1);transition:filter .4s,opacity .4s}
.player-panel.human .ship-img{transform:scaleX(-1)}

/* hull overlay */
.hull-overlay{position:absolute;bottom:0;left:0;right:0;padding:3px 8px;
  background:linear-gradient(to top,rgba(6,8,16,.95),transparent)}
.hull-label{font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:2px;color:var(--muted);
  margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
/* tower-human / tower-ai: original renderBar sets innerHTML */
#tower-human{font-weight:700;font-size:.7rem;color:#00aaff}
#tower-ai{font-weight:700;font-size:.7rem;color:#ff4444}
.hull-bar-bg{height:5px;background:#111;border-radius:3px;overflow:hidden;border:1px solid #222}
/* bar-human / bar-ai: renderBar sets .width (patched from .height) */
#bar-human{height:100%;border-radius:3px;transition:width .4s ease;
  background:linear-gradient(90deg,#004488,#00aaff);box-shadow:0 0 6px #00aaff55}
#bar-ai{height:100%;border-radius:3px;transition:width .4s ease;
  background:linear-gradient(90deg,#880000,#ff4444);box-shadow:0 0 6px #ff444455}
.tower-bar-fill.danger{background:linear-gradient(90deg,#881100,#ff2200) !important}

/* shield-human / shield-ai: renderBar sets textContent = '🛡 Štít: N' */
#shield-human,#shield-ai{
  position:absolute;top:3px;font-family:'Orbitron',monospace;font-size:.6rem;
  color:var(--shield);background:rgba(0,0,0,.7);border:1px solid #aa8800;
  border-radius:4px;padding:1px 5px}
#shield-human{right:6px} #shield-ai{left:6px}

/* resources — original uses .res-row class and ids res-human / res-ai */
.res-row{display:flex;gap:3px;padding:2px 4px;flex-wrap:nowrap;flex-shrink:0;
  background:rgba(0,0,0,.4);border-top:1px solid var(--border);align-items:center}
.player-panel.human .res-row{flex-direction:row;justify-content:flex-start}
.player-panel.ai    .res-row{flex-direction:row-reverse;justify-content:flex-start}
.res-chip{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.68rem;white-space:nowrap}
.res-chip .icon{font-size:.85rem}
.res-chip .prod{color:var(--muted);font-size:.6rem}

/* MIDDLE */
#mid-col{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
#log-wrap{flex:1;background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:6px;
  padding:6px 8px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#222 transparent}
#log-wrap h3{font-family:'Orbitron',monospace;font-size:.48rem;letter-spacing:2px;color:var(--muted);margin-bottom:3px;text-align:center}
#log{display:flex;flex-direction:column;gap:1px}
.log-line{font-size:.72rem;padding:2px 0;border-bottom:1px solid #111;color:var(--text);line-height:1.4}
.log-line.round-sep{color:var(--muted);font-size:.65rem;letter-spacing:2px;padding-top:5px;font-family:'Orbitron',monospace;font-weight:700}
.log-line.good{color:#44aaff}   /* hráč – modrá */
.log-line.bad{color:#ff5555}    /* AI / damage – červená */
.log-line.info{color:#8899bb}   /* neutrální info – šedavá */
.log-line.gold{color:#ffcc00}   /* speciální efekty – zlatá */

#vs-badge{background:var(--border);border-radius:4px;text-align:center;padding:2px;
  font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:1px;color:var(--muted);flex-shrink:0;display:none}
#ai-hand-wrap{background:rgba(60,0,0,.2);border:1px solid #2a1010;border-radius:6px;padding:3px 6px;flex-shrink:0}
#ai-hand-wrap h3{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:2px;color:#e07070;margin-bottom:3px}
#ai-hand-cards{display:flex;flex-wrap:wrap;gap:3px}
.ai-card-chip{background:rgba(180,0,0,.1);border:1px solid #3d1515;border-radius:4px;
  padding:2px 5px;font-size:.62rem;display:flex;align-items:center;gap:3px}
.ai-chip-name{font-weight:700;color:var(--text)}
.ai-chip-cost{color:var(--muted);font-size:.58rem}

/* HAND */
#hand-section{background:rgba(0,20,50,.3);border:1px solid var(--border);border-radius:6px;padding:3px 6px}
#hand-section h3{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:2px;color:var(--muted);margin-bottom:3px}
#hand-cards{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:thin;scrollbar-color:#222 transparent}

/* CARDS — original class names: card, t-attack, t-sabotage, t-buildtower, t-buildshield, t-production, t-special, t-trade */
.card{min-width:95px;max-width:108px;flex-shrink:0;background:#0c1020;border-radius:6px;
  border:1px solid var(--border);cursor:pointer;user-select:none;padding:5px 6px;
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.card.t-attack::before{background:var(--attack)}
.card.t-sabotage::before{background:var(--sabotage)}
.card.t-buildtower::before{background:var(--tower)}
.card.t-buildshield::before{background:var(--shield)}
.card.t-production::before{background:var(--prod)}
.card.t-special::before{background:var(--special)}
.card.t-trade::before{background:var(--trade)}
.card:hover:not(.unaffordable){transform:translateY(-5px);box-shadow:var(--glow)}
.card.unaffordable{opacity:.35;cursor:not-allowed}
.card.selected{transform:translateY(-7px);box-shadow:0 0 0 2px #00aaff,var(--glow)}
.card-icon{font-size:1rem;line-height:1;margin-bottom:2px}
.card-name{font-size:.68rem;font-weight:700;line-height:1.2;margin-bottom:2px}
.card-cost{font-size:.72rem;font-weight:700;margin-bottom:2px}
.card-desc{font-size:.58rem;color:var(--muted);line-height:1.3}

/* ACTION BAR */
#action-bar{display:flex;align-items:center;gap:6px;padding:4px 8px;
  background:rgba(0,0,0,.7);border-top:1px solid var(--border);border-radius:6px}
#action-hint{flex:1;font-size:.65rem;color:var(--text);font-family:'Orbitron',monospace;letter-spacing:1px}
.btn{font-family:'Orbitron',monospace;font-size:.6rem;letter-spacing:2px;padding:6px 14px;
  border-radius:4px;border:none;cursor:pointer;font-weight:700;text-transform:uppercase;
  white-space:nowrap;transition:filter .15s,transform .1s;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-play{background:linear-gradient(135deg,#003366,#0055aa);color:#00ccff;border:1px solid #0066cc;box-shadow:0 0 10px rgba(0,100,200,.4)}
.btn-discard{background:linear-gradient(135deg,#2a1000,#553300);color:#ff8800;border:1px solid #663300}
.btn-play:hover,.btn-discard:hover{filter:brightness(1.3)}

/* DAMAGE VISUALS */
@keyframes _fire{0%{transform:translateY(0) scaleX(1);opacity:.9}50%{transform:translateY(-10px) scaleX(1.1);opacity:.55}100%{transform:translateY(-20px) scaleX(.8);opacity:0}}
@keyframes _smoke{0%{transform:translateY(0) scale(1);opacity:.4}100%{transform:translateY(-35px) scale(2);opacity:0}}
@keyframes _flicker{0%,100%{opacity:.85}40%{opacity:.5}75%{opacity:.65}}
@keyframes _pulse{0%,100%{box-shadow:none}50%{box-shadow:inset 0 0 30px rgba(255,60,0,.35)}}
@keyframes _hitflash{0%{opacity:1}100%{opacity:0}}
.player-panel[data-dmg="1"] .ship-img{filter:saturate(1) contrast(1.1)}
.player-panel[data-dmg="2"] .ship-img{filter:saturate(.65) contrast(1.25) brightness(.8)}
.player-panel[data-dmg="3"] .ship-img{filter:saturate(.3) contrast(1.45) brightness(.65);animation:_flicker 1.5s ease-in-out infinite}
.player-panel[data-dmg="4"] .ship-img{filter:saturate(.05) contrast(1.7) brightness(.4);animation:_flicker .55s ease-in-out infinite}
.player-panel[data-dmg="2"]{animation:_pulse 2s ease-in-out infinite}
.player-panel[data-dmg="3"]{animation:_pulse 1s ease-in-out infinite}
.player-panel[data-dmg="4"]{animation:_pulse .4s ease-in-out infinite}
.hit-flash::after{content:'';position:absolute;inset:0;border-radius:8px;
  background:radial-gradient(circle,rgba(255,80,0,.55),transparent 70%);
  animation:_hitflash .4s ease forwards;pointer-events:none}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="hdr-side blue">FEDERATION</div>
    <div class="hdr-center">
      <h1>STELLAR CONFLICT</h1>
      <div id="round-label">—</div>
    </div>
    <div class="hdr-side red">DOMINION</div>
  </header>

  <div id="battlefield">

    <div class="player-panel human" id="panel-human">
      <div class="ship-name">⚡ UFS AURORA</div>
      <div class="ship-img-wrap">
        <img class="ship-img" id="ship-img-human" src="" alt="">
        <div id="shield-human"></div>
        <div class="hull-overlay">
          <div class="hull-label">
            <span>HULL</span>
            <div id="tower-human">20<span style="font-size:.6rem;color:var(--muted)">/50</span></div>
          </div>
          <div class="hull-bar-bg"><div id="bar-human" class="tower-bar-fill" style="width:40%"></div></div>
        </div>
      </div>
      <div class="res-row" id="res-human"></div>
    </div>

    <div id="mid-col">
      <div id="log-wrap"><h3>COMBAT LOG</h3><div id="log"></div></div>
      <!-- DEBUG: set DEBUG_SHOW_AI_HAND=true in JS to reveal enemy modules -->
      <div id="vs-badge">VS</div>
      <div id="ai-hand-wrap" style="display:none"><h3>ENEMY MODULES</h3><div id="ai-hand-cards"></div></div>
    </div>

    <div class="player-panel ai" id="panel-ai">
      <div class="ship-name">OBLIVION 🔥</div>
      <div class="ship-img-wrap">
        <img class="ship-img" id="ship-img-ai" src="" alt="">
        <div id="shield-ai"></div>
        <div class="hull-overlay">
          <div class="hull-label">
            <span>HULL</span>
            <div id="tower-ai">20<span style="font-size:.6rem;color:var(--muted)">/50</span></div>
          </div>
          <div class="hull-bar-bg"><div id="bar-ai" class="tower-bar-fill" style="width:40%"></div></div>
        </div>
      </div>
      <div class="res-row" id="res-ai"></div>
    </div>

  </div>

  <div id="hand-section">
    <h3>⚡ YOUR MODULES</h3>
    <div id="hand-cards"></div>
  </div>

  <div id="action-bar">
    <span id="action-hint">—</span>
    <button class="btn btn-play"    id="btn-play"    onclick="actionPlay()">COMMAND</button>
    <button class="btn btn-discard" id="btn-discard" onclick="actionDiscard()">DISCARD</button>
    <button class="btn btn-play"    id="btn-newgame" onclick="initGame()" style="display:none">NEW BATTLE</button>
  </div>

</div>

let G = {};

function makePlayer(name) {
  return {
    name, tower:20, shield:0,
    e:5, m:5, d:5,
    ep:1, mp:1, dp:1,
    deck:[], hand:[], discard:[]
  };
}

function buildDeck() {
  let d = [...CARDS, ...CARDS];
  for (let i=d.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

function drawCard(p) {
  if (p.deck.length===0) {
    if (p.discard.length===0) return;
    p.deck = [...p.discard]; p.discard=[];
    for(let i=p.deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p.deck[i],p.deck[j]]=[p.deck[j],p.deck[i]];}
    log(`[${p.name}] Zamíchal odpadní balík.`, 'info');
  }
  if (p.deck.length>0) { p.hand.push(p.deck.shift()); }
}

function canPlay(p, c) {
  if (c.type === 'emergency') return p.tower > 1;
  return p.e >= c.cost.e && p.m >= c.cost.m && p.d >= c.cost.d;
}

//  GAME LOGIC
// ════════════════════════════════════════════════════════════
function initGame() {
  document.getElementById('btn-play').style.display='';
  document.getElementById('btn-discard').style.display='';
  document.getElementById('btn-newgame').style.display='none';
  G = {
    round: 1,
    phase: 'player', // player | ai | end
    selectedIdx: -1,
    discardMode: false,
    human: makePlayer('Hráč'),
    ai:    makePlayer('AI'),
  };
  G.human.deck = buildDeck();
  G.ai.deck    = buildDeck();
  document.getElementById('log').innerHTML = '';
  for(let i=0;i<6;i++){drawCard(G.human);drawCard(G.ai);}
  G.human.e=5;G.human.m=5;G.human.d=5;
  G.ai.e=5;G.ai.m=5;G.ai.d=5;
  startPlayerTurn();
}

function startPlayerTurn() {
  G.phase = 'player';
  G.selectedIdx = -1;
  G.discardMode = false;
  G.human.e += G.human.ep;
  G.human.m += G.human.mp;
  G.human.d += G.human.dp;
  G.ai.e    += G.ai.ep;
  G.ai.m    += G.ai.mp;
  G.ai.d    += G.ai.dp;
  // doplnit ruku na 5 PŘED tvým tahem (po případné sabotáži z minulého kola)
  // — NE zde, doplňuje se až po AI tahu aby trest trval celý hráčův tah
  log(`── KOLO ${G.round} ──`, 'round-sep');
  document.getElementById('round-label').textContent = `KOLO ${G.round}`;
  setHint('Vyber kartu k zahrání nebo zahození.');
  showActionBar('normal');
  render();
}

function actionPlay() {
  if (G.selectedIdx < 0) { setHint('⚠ Nejdřív vyber kartu!'); return; }
  const card = G.human.hand[G.selectedIdx];
  if (!canPlay(G.human, card)) {
    log(`⚠ Nemáš dost surovin na "${card.name}" — karta zahozena!`, 'bad');
    G.human.hand.splice(G.selectedIdx,1);
    G.human.discard.push(card);
    drawCard(G.human);
    endPlayerTurn();
    return;
  }
  spend(G.human, card);
  G.human.hand.splice(G.selectedIdx,1);
  G.human.discard.push(card);
  applyEffect(card, G.human, G.ai);
  drawCard(G.human);
  endPlayerTurn();
}

function actionDiscard() {
  if (G.selectedIdx < 0) { setHint('⚠ Nejdřív vyber kartu, kterou chceš zahodit!'); return; }
  const card = G.human.hand[G.selectedIdx];
  G.human.hand.splice(G.selectedIdx,1);
  G.human.discard.push(card);
  log(`Zahodil jsi kartu "${card.name}".`, 'info');
  drawCard(G.human);
  endPlayerTurn();
}

function endPlayerTurn() {
  G.selectedIdx = -1;
  if (checkVictory()) return;
  // doplnit ruku na 6 až TEĎ — trest za sabotáž z AI tahu trval celý náš tah
  while (G.human.hand.length < 6) drawCard(G.human);
  render();
  showActionBar('waiting');
  setHint('Tah AI...');
  setTimeout(aiTurn, 900);
}

function aiTurn() {
  G.phase = 'ai';
  const ai = G.ai, hu = G.human;
  // doplnit ruku AI na 6 na začátku svého tahu
  while (ai.hand.length < 6) drawCard(ai);

  // produkce má vždy přednost před stavbou
  const prio = ['attack','attack_emp','sabotage_res','sabotage_dis','sabotage_prod','sabotage_prod_m','sabotage_prod_d','prod_e','prod_m','prod_d','build_tower','build_shield','trade_em','trade_ed','trade_me','trade_md','trade_de','trade_dm','special','emergency'];

  let chosen = null;
  for (const t of prio) {
    const cands = ai.hand
      .filter(c => c.type===t && canPlay(ai,c))
      .filter(c => {
        if(c.type==='special') return hu.ep>0||hu.mp>0||hu.dp>0;
        if(c.type==='emergency') {
          const hasOtherPlayable = ai.hand.some(x => x.type!=='emergency' && canPlay(ai,x));
          return !hasOtherPlayable || (ai.e===0&&ai.m===0&&ai.d===0) || (ai.tower<15&&(ai.e+ai.m+ai.d)<5);
        }
        return true;
      })
      .sort((a,b)=>b.power-a.power);
    if(cands.length){ chosen=cands[0]; break; }
  }
  if (chosen) {
    spend(ai, chosen);
    ai.hand.splice(ai.hand.indexOf(chosen),1);
    ai.discard.push(chosen);
    log(`AI zahrála: ${TYPE_META[chosen.type].icon} ${chosen.name}`, 'info');
    applyEffect(chosen, ai, hu);
  } else {
    // zahodit nejdražší NEzahratelnou kartu — Emergency nikdy nezahazovat pokud má věž > 1
    if(ai.hand.length>0){
      const unplayable = ai.hand.filter(c => c.type==='emergency' ? false : !canPlay(ai,c));
      const disc = (unplayable.length > 0 ? unplayable : ai.hand)
        .sort((a,b)=>costVal(b)-costVal(a))[0];
      ai.hand.splice(ai.hand.indexOf(disc),1);
      ai.discard.push(disc);
      log(`  ▶ AI zahodila: ${disc.name}`, 'info');
    }
  }
  if(checkVictory()) return;
  G.round++;
  startPlayerTurn();
}

function spend(p, c) {
  p.e -= c.cost.e; p.m -= c.cost.m; p.d -= c.cost.d;
}

function applyEffect(card, self, enemy) {
  const t = card.type;
  if (t==='attack'||t==='attack_emp') {
    let dmg = card.power;
    if(t==='attack' && enemy.shield>0){
      const abs = Math.min(enemy.shield, dmg);
      enemy.shield -= abs; dmg -= abs;
      if(abs>0) log(`  Štít absorboval ${abs} — zbývá štít: ${enemy.shield}.`,'info');
    } else if(t==='attack_emp') {
      log(`  EMP ignoruje štít!`,'gold');
    }
    enemy.tower -= dmg;
    enemy.tower = Math.max(0, enemy.tower);
    if(dmg>0) log(`  ${enemy.name} přišel o ${dmg} pater věže → ${enemy.tower}/50.`,'bad');
  } else if(t==='sabotage_res'){
    const key = card.steal;
    const amt = Math.min(card.power, enemy[key]);
    enemy[key] -= amt; self[key] += amt;
    const n = key==='e'?'energie':key==='m'?'surovin':'dat';
    log(`  Ukradeno ${amt} ${n} od ${enemy.name}.`,'good');
  } else if(t==='sabotage_dis'){
    let disc=0;
    for(let i=0;i<card.power&&enemy.hand.length>0;i++){
      const idx=Math.floor(Math.random()*enemy.hand.length);
      const lost=enemy.hand.splice(idx,1)[0];
      enemy.discard.push(lost);
      log(`  💥 ${self.name} vyhodil z ruky ${enemy.name}: "${lost.name}".`,'bad'); disc++;
    }
    if(!disc) log(`  ${enemy.name} nemá karty.`,'info');
  } else if(t==='sabotage_prod'){
    enemy.ep = Math.max(0, enemy.ep - card.power);
    log(`  ${enemy.name}: produkce energie -${card.power} → ${enemy.ep}/kolo.`,'bad');
  } else if(t==='sabotage_prod_m'){
    enemy.mp = Math.max(0, enemy.mp - card.power);
    log(`  ${enemy.name}: produkce surovin -${card.power} → ${enemy.mp}/kolo.`,'bad');
  } else if(t==='sabotage_prod_d'){
    enemy.dp = Math.max(0, enemy.dp - card.power);
    log(`  ${enemy.name}: produkce dat -${card.power} → ${enemy.dp}/kolo.`,'bad');
  } else if(t==='build_tower'){
    self.tower = Math.min(50, self.tower + card.power);
    log(`  ${self.name} přidal ${card.power} pater věže → ${self.tower}/50.`,'good');
  } else if(t==='build_shield'){
    self.shield += card.power;
    log(`  ${self.name} získal +${card.power} štítu → celkem ${self.shield}.`,'good');
  } else if(t==='prod_e'){
    self.ep += card.power;
    log(`  ${self.name}: produkce energie +${card.power} → ${self.ep}/kolo.`,'good');
  } else if(t==='prod_m'){
    self.mp += card.power;
    log(`  ${self.name}: produkce surovin +${card.power} → ${self.mp}/kolo.`,'good');
  } else if(t==='prod_d'){
    self.dp += card.power;
    log(`  ${self.name}: produkce dat +${card.power} → ${self.dp}/kolo.`,'good');
  } else if(t==='special'){
    let stolen=0;
    if(enemy.ep>0){enemy.ep--;self.ep++;stolen++;}
    if(enemy.mp>0){enemy.mp--;self.mp++;stolen++;}
    if(enemy.dp>0){enemy.dp--;self.dp++;stolen++;}
    if(stolen===0) log(`  Quantum Redistribution — soupeř má vše na 0, žádný efekt.`,'info');
    else log(`  ✨ Quantum Redistribution! Ukradeno ${stolen}/3 produkcí. Tvoje produkce: ⚡${self.ep} 💎${self.mp} 💾${self.dp}`,'gold');
  } else if(t.startsWith('trade_')){
    const from = t[6], to = t[7];
    const icons = {e:'⚡', m:'💎', d:'💾'};
    self[to] += card.power;
    log(`  ${self.name} přeměnil 4${icons[from]} → 4${icons[to]}.`,'good');
  } else if(t==='emergency'){
    const loss = Math.ceil(self.tower / 2);
    self.tower = Math.max(0, self.tower - loss);
    self.e += card.power;
    self.m += card.power;
    self.d += card.power;
    log(`  🆘 Emergency Protocol! Věž -${loss} → ${self.tower}/50. Získáno +${card.power}⚡ +${card.power}💎 +${card.power}💾.`,'gold');
  }
}

function checkVictory() {
  const h=G.human, a=G.ai;
  if(h.tower<=0)   { endGame('AI',   'AI zničila tvoji věž!'); return true; }
  if(h.tower>=50)  { endGame('Hráč', 'Postavil jsi věž na 50! 🏆'); return true; }
  if(a.tower<=0)   { endGame('Hráč', 'Zničil jsi věž AI!'); return true; }
  if(a.tower>=50)  { endGame('AI',   'AI postavila věž na 50!'); return true; }
  return false;
}

function endGame(winner, msg) {
  G.phase='end';
  const win = winner==='Hráč';
  document.getElementById('btn-play').style.display='none';
  document.getElementById('btn-discard').style.display='none';
  document.getElementById('btn-newgame').style.display='';
  setHint((win ? '🏆 VYHRÁL JSI! ' : '💀 PROHRÁL JSI! ') + msg + ` (kolo ${G.round})`);
  render();
}

function renderResChips(p, elId) {

function renderBar(p, barId, numId, shieldId) {
  const pct = Math.max(0, Math.min(100, p.tower/50*100));
  const bar = document.getElementById(barId);
  bar.style.width = pct + '%';
  bar.className = 'tower-bar-fill' + (p.tower<=10?' danger':'');

  document.getElementById(shieldId).textContent = `🛡 Štít: ${p.shield}`;

function renderHand() {
  const el = document.getElementById('hand-cards');
  el.innerHTML = '';
  G.human.hand.forEach((c,i)=>{
    const m = TYPE_META[c.type];
    const affordable = canPlay(G.human,c);
    const costStr = c.type==='emergency' ? '🆘 ZDARMA' : c.cost.e ? `${m.costIcon}${c.cost.e}` : c.cost.m ? `${m.costIcon}${c.cost.m}` : `${m.costIcon}${c.cost.d}`;
    const div = document.createElement('div');
    div.className = `card ${m.cls}${!affordable?' unaffordable':''}${G.selectedIdx===i?' selected':''}`;
    div.innerHTML = `
      <div class="card-icon">${m.icon}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-cost">${costStr}</div>
      <div class="card-desc">${c.desc}</div>
    `;
    div.onclick = ()=>selectCard(i);
    el.appendChild(div);
  });
}

function renderAIHand() {
  const el = document.getElementById('ai-hand-cards');
  el.innerHTML = '';
  G.ai.hand.forEach(c => {
    const m = TYPE_META[c.type];
    const cost = c.cost.e ? `⚡${c.cost.e}` : c.cost.m ? `💎${c.cost.m}` : c.cost.d ? `💾${c.cost.d}` : 'FREE';
    const div = document.createElement('div');
    div.className = `ai-card-chip`;
    div.innerHTML = `<span>${m.icon}</span><span class="ai-chip-name">${c.name}</span><span class="ai-chip-cost">${cost}</span>`;
    el.appendChild(div);
  });
}

function render() {
  renderBar(G.human,'bar-human','tower-human','shield-human');
  renderBar(G.ai,   'bar-ai',  'tower-ai',  'shield-ai');
  renderResChips(G.human,'res-human');
  renderResChips(G.ai,   'res-ai');
  renderHand();
  renderAIHand();
}

// ── HULL/UPGRADE SYSTEM ─────────────────────────────────────
// Je hráč v upgrade zóně? (tower > 20)
function isUpgrading(p) { return p.tower > 20; }

// Effective cost pro build_tower kartu (o 1 dražší v upgrade zóně)
function buildCost(p, card) {
  if (card.type !== 'build_tower') return card.cost;
  const extra = isUpgrading(p) ? 1 : 0;
  return { e: card.cost.e, m: card.cost.m + extra, d: card.cost.d };
}

// Přepíšeme canPlay aby zohlednil upgrade cenu
const _origCanPlay = canPlay;
canPlay = function(p, c) {
  if (c.type === 'emergency') return p.tower > 1;
  const cost = buildCost(p, c);
  return p.e >= cost.e && p.m >= cost.m && p.d >= cost.d;
};

// Přepíšeme spend aby odečetl správnou cenu
const _origSpend = spend;
spend = function(p, c) {
  const cost = buildCost(p, c);
  p.e -= cost.e; p.m -= cost.m; p.d -= cost.d;
};

// Přepíšeme renderBar – dvoubarevný bar + dynamický label
const _origRenderBar = renderBar;
renderBar = function(p, barId, numId, shieldId) {
  // Hull bar: 0-20 = první zóna (40% šířky baru), 21-50 = druhá zóna
  const bar = document.getElementById(barId);
  const isHuman = barId === 'bar-human';

  const hullPct   = Math.max(0, Math.min(40, p.tower / 20 * 40));    // 0–40% pro hull zónu
  const upgradePct = p.tower > 20 ? ((p.tower - 20) / 30 * 60) : 0; // 0–60% pro upgrade zónu
  const totalPct = hullPct + upgradePct;

  // Barva: červená danger < 10, normální hull barva, zlatá pokud upgrade
  let grad;
  if (p.tower <= 10) {
    grad = isHuman
      ? 'linear-gradient(90deg,#550000,#ff2200)'
      : 'linear-gradient(90deg,#550000,#ff2200)';
  } else if (p.tower <= 20) {
    grad = isHuman
      ? 'linear-gradient(90deg,#004488,#00aaff)'
      : 'linear-gradient(90deg,#880000,#ff4444)';
  } else {
    // upgrade zóna – gradient přechází z hull barvy do zlaté
    grad = isHuman
      ? 'linear-gradient(90deg,#004488 0%,#00aaff 40%,#cc8800 41%,#ffcc00 100%)'
      : 'linear-gradient(90deg,#880000 0%,#ff4444 40%,#cc8800 41%,#ffcc00 100%)';
  }
  bar.style.width = totalPct + '%';
  bar.style.background = grad;
  bar.style.boxShadow = p.tower > 20
    ? '0 0 8px rgba(255,200,0,.6)'
    : isHuman ? '0 0 6px #00aaff55' : '0 0 6px #ff444455';

  // Label: dynamický
  const numEl = document.getElementById(numId);
  if (p.tower <= 20) {
    numEl.innerHTML = `HULL <strong>${p.tower}</strong><span style="font-size:.55rem;color:var(--muted)">/20</span>`;
  } else {
    const upg = p.tower - 20;
    numEl.innerHTML = `<span style="color:#ffcc00;font-size:.6rem">UPG</span> <strong style="color:#ffcc00">${upg}</strong><span style="font-size:.55rem;color:var(--muted)">/30</span>`;
  }

  // Shield
  const shieldEl = document.getElementById(shieldId);
  if (shieldEl) shieldEl.style.display = p.shield > 0 ? 'block' : 'none';
};

// Patch renderHand – zobrazit upravenou cenu build_tower karet
const _origRenderHand = renderHand;
renderHand = function() {
  _origRenderHand();
  // Po renderování zkontroluj build_tower karty a uprav zobrazení ceny
  if (!G || !G.human) return;
  const cards = document.querySelectorAll('#hand-cards .card');
  G.human.hand.forEach((c, i) => {
    if (c.type !== 'build_tower') return;
    const el = cards[i];
    if (!el) return;
    const costEl = el.querySelector('.card-cost');
    if (!costEl) return;
    const inUpgrade = isUpgrading(G.human);
    const realCost = c.cost.m + (inUpgrade ? 1 : 0);
    if (inUpgrade) {
      costEl.innerHTML = `💎 ${realCost} <span style="font-size:.58rem;color:#ffcc00">(+1 upgrade)</span>`;
    }
  });
};

// Patch actionPlay to log player's card (original doesn't log it)
const _origActionPlay = actionPlay;
actionPlay = function() {
  if (G.selectedIdx >= 0 && G.phase === 'player') {
    const card = G.human.hand[G.selectedIdx];
    if (card && canPlay(G.human, card)) {
      const m = TYPE_META[card.type];
      log(`Hráč zahrál: ${m.icon} ${card.name}`, 'good');
    }
  }
  _origActionPlay();
};

// Patch log() to use faction-based colors
const _origLog = log;
log = function(msg, cls) {
  // reclassify based on message content
  let newCls = cls;
  const m = msg.toLowerCase();

  if (cls === '' || cls === 'info') {
    // AI actions -> bad (red)
    if (msg.startsWith('AI zahrála') || msg.startsWith('  ▶ AI')) newCls = 'bad';
    // Player actions -> good (blue)
    else if (msg.startsWith('Zahodil jsi') || msg.startsWith('⚠')) newCls = 'good';
    // Neutral info (shield absorbed, reshuffle, card effects) -> info
    else newCls = 'info';
  }
  if (cls === 'good') {
    // check if message is about AI benefiting -> bad
    if (m.includes('ai získal') || m.includes('ai přidal') || m.includes('ai: produkce')) newCls = 'bad';
    // player benefit -> good (blue) - keep
  }
  if (cls === 'bad') {
    // damage to player -> bad (red)  
    // damage to AI (player attack hit) -> good (blue)
    if (m.includes('ai přišel') || m.includes('ai: produkce')) newCls = 'good';
  }
  _origLog(msg, newCls);
};

// Patch renderResChips: AI panel shows chips in reverse order (D/M/E from right edge)
const _origResChips = renderResChips;
renderResChips = function(p, elId) {
  _origResChips(p, elId);
  if (elId === 'res-ai') {
    const el = document.getElementById(elId);
    const chips = Array.from(el.children);
    chips.reverse().forEach(ch => el.appendChild(ch));
  }
};

// ADDON: Sounds + Damage visuals (wraps originals, no logic change)
// ══════════════════════════════════════════════════════════════════
let _ac=null;
function _ctx(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function _tone(type,f1,f2,dur,vol){try{const c=_ctx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(f1,c.currentTime);o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.start();o.stop(c.currentTime+dur+.05);}catch(e){}}
function _noise(dur,vol,fq){try{const c=_ctx(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;const g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start();s.stop(c.currentTime+dur);}catch(e){}}

const _origApply = applyEffect;
applyEffect = function(card, self, enemy) {
  const t=card.type;
  if(t==='attack'){_tone('sawtooth',180,70,.25,.3);_noise(.15,.15,400);}
  if(t==='attack_emp'){_tone('square',800,50,.4,.3);_noise(.25,.2,200);}
  if(t==='build_tower'){_tone('sine',400,700,.2,.2);}
  if(t==='build_shield'){_tone('sine',600,900,.15,.2);}
  if(t.startsWith('sabotage')){_tone('square',300,130,.2,.22);}
  _origApply(card, self, enemy);
  if(t==='attack'||t==='attack_emp'){
    const pid=enemy===G.human?'panel-human':'panel-ai';
    const el=document.getElementById(pid);
    el.classList.remove('hit-flash');void el.offsetWidth;el.classList.add('hit-flash');
    setTimeout(()=>el.classList.remove('hit-flash'),450);
  }
};

const _origEndGame = endGame;
endGame = function(winner, msg) {
  if(winner==='Hráč'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>_tone('sine',f,f,.3,.3),i*180));}
  else{[400,300,200,100].forEach((f,i)=>setTimeout(()=>_tone('sawtooth',f,f*.8,.4,.28),i*200));}
  _origEndGame(winner, msg);
};

function _dmgLevel(h){return h>=20?0:h>=14?1:h>=8?2:h>=3?3:4;}
function _buildFire(n){
  let s='<div style="position:absolute;bottom:15%;width:100%;height:55%;display:flex;justify-content:space-around;align-items:flex-end">';
  for(let i=0;i<n;i++){const dur=(.5+Math.random()*.8).toFixed(2),del=(Math.random()*1.2).toFixed(2),sz=7+Math.random()*13,col=Math.random()>.5?'#ff4400':'#ff8800';s+=`<div style="width:${sz}px;height:${sz*1.7}px;border-radius:50% 50% 20% 20%;background:radial-gradient(ellipse at bottom,${col},transparent);animation:_fire ${dur}s linear -${del}s infinite;filter:blur(2px)"></div>`;}
  for(let i=0;i<Math.ceil(n/2);i++){const l=(10+Math.random()*80).toFixed(0),dur=(1+Math.random()*1.4).toFixed(2),del=(Math.random()*2).toFixed(2),sz=18+Math.random()*28;s+=`<div style="position:absolute;left:${l}%;bottom:20%;width:${sz}px;height:${sz}px;border-radius:50%;background:radial-gradient(circle,rgba(70,70,70,.55),transparent);animation:_smoke ${dur}s ease-out -${del}s infinite;filter:blur(5px)"></div>`;}
  return s+'</div>';
}
function _updateDmg(panelId,hull){
  const panel=document.getElementById(panelId);
  const lvl=_dmgLevel(hull);
  panel.dataset.dmg=lvl;
  let ov=panel.querySelector('._ov');
  if(!ov){ov=document.createElement('div');ov.className='_ov';ov.style.cssText='position:absolute;inset:0;pointer-events:none;border-radius:8px;overflow:hidden;';panel.querySelector('.ship-img-wrap').appendChild(ov);}
  ov.innerHTML=lvl>0?_buildFire([0,2,5,9,14][lvl]):'';
}

const _origRender = render;
render = function() {
  _origRender();
  _updateDmg('panel-human',G.human.tower);
  _updateDmg('panel-ai',G.ai.tower);
};

document.addEventListener('click',()=>{try{_ctx().resume();}catch(e){}},{once:true});
document.addEventListener('touchstart',()=>{try{_ctx().resume();}catch(e){}},{once:true});
</script>
