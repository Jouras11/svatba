<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STELLAR CONFLICT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════════════════
   MAIN MENU
════════════════════════════════════════════════════ */
#main-menu {
  position:fixed; inset:0; z-index:900;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:#060810; overflow:hidden;
}
#menu-canvas { position:absolute; inset:0; z-index:0; }
.menu-content {
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  width:100%; max-width:360px; padding:0 16px;
}
.menu-logo {
  font-family:'Orbitron',monospace; font-weight:900;
  font-size:clamp(1.1rem,5.5vw,2rem); letter-spacing:4px;
  background:linear-gradient(90deg,#00aaff,#ffffff,#ff4444);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-align:center; margin-bottom:4px; white-space:nowrap;
  animation:_menu_in .8s ease forwards;
}
.menu-tagline {
  font-family:'Orbitron',monospace; font-size:clamp(.42rem,.9vw,.58rem);
  letter-spacing:4px; color:#4a6080; text-align:center; margin-bottom:36px;
}
@keyframes _menu_in {
  from { opacity:0; transform:translateY(-12px); }
  to   { opacity:1; transform:translateY(0); }
}
.menu-section-label {
  font-family:'Orbitron',monospace; font-size:.48rem; letter-spacing:4px;
  color:#2a3555; text-align:center; margin-bottom:8px; margin-top:16px; width:100%;
}
.menu-btn {
  width:100%; padding:13px 18px; font-family:'Orbitron',monospace;
  font-size:.7rem; font-weight:700; letter-spacing:2px; border:1px solid;
  border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:12px;
  transition:transform .15s, box-shadow .15s; margin-bottom:9px;
  animation:_mbtn_in .5s ease forwards; opacity:0;
}
.menu-btn:hover { transform:translateX(5px); }
.btn-icon { font-size:1.15rem; flex-shrink:0; }
.btn-text { flex:1; text-align:left; }
.btn-sub  { font-size:.5rem; opacity:.6; font-weight:400; letter-spacing:1px; display:block; margin-top:2px; }
.menu-btn.primary {
  background:linear-gradient(135deg,rgba(0,68,136,.6),rgba(0,136,204,.3));
  border-color:#0088cc; color:#00ccff; box-shadow:0 0 18px rgba(0,170,255,.12);
}
.menu-btn.primary:hover { box-shadow:0 0 28px rgba(0,170,255,.35); }
.menu-btn.secondary {
  background:linear-gradient(135deg,rgba(30,0,60,.6),rgba(80,0,120,.3));
  border-color:#6622aa; color:#aa66ff; box-shadow:0 0 18px rgba(170,85,255,.1);
}
.menu-btn.secondary:hover { box-shadow:0 0 28px rgba(170,85,255,.3); }
.menu-btn.locked {
  background:rgba(20,20,30,.4); border-color:#1a2035; color:#2a3555; cursor:not-allowed;
}
.menu-btn.locked:hover { transform:none; }
.menu-btn.info {
  padding:9px 16px; font-size:.6rem; letter-spacing:2px;
  background:rgba(0,0,0,.5); border-color:#1a2035; color:#4a6080;
}
.menu-btn.info:hover { color:#c8d8f0; border-color:#4a6080; }
.menu-divider { width:100%; height:1px; margin:14px 0; background:linear-gradient(90deg,transparent,#1a2035,transparent); }
.menu-version { font-family:'Orbitron',monospace; font-size:.4rem; letter-spacing:2px; color:#1a2035; margin-top:18px; }
@keyframes _mbtn_in {
  from { opacity:0; transform:translateX(-14px); }
  to   { opacity:1; transform:translateX(0); }
}
.menu-content .menu-btn:nth-child(1){animation-delay:.15s;}
.menu-content .menu-btn:nth-child(2){animation-delay:.25s;}
.menu-content .menu-btn:nth-child(3){animation-delay:.35s;}
.menu-content .menu-btn:nth-child(4){animation-delay:.45s;}
.menu-content .menu-btn:nth-child(5){animation-delay:.55s;}

:root{
  --bg:#060810; --panel:#0a0e1a; --border:#1a2035; --text:#c8d8f0; --muted:#4a6080;
  --attack:#ff4444; --sabotage:#00ccff; --tower:#ff8800; --shield:#ffcc00;
  --prod:#aa55ff; --special:#ff44aa; --trade:#00ffaa;
  --glow:0 0 18px rgba(0,170,255,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-size:13px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 8% 12%,#fff,transparent),
    radial-gradient(1px 1px at 22% 45%,#aef,transparent),
    radial-gradient(1px 1px at 38% 72%,#fff,transparent),
    radial-gradient(1px 1px at 54% 18%,#ffa,transparent),
    radial-gradient(1px 1px at 68% 88%,#fff,transparent),
    radial-gradient(1px 1px at 82% 52%,#aff,transparent),
    radial-gradient(1px 1px at 91% 33%,#fff,transparent),
    radial-gradient(1px 1px at 4%  77%,#fff,transparent),
    radial-gradient(1px 1px at 30% 8%, #fff,transparent),
    radial-gradient(1px 1px at 75% 25%,#fff,transparent),
    radial-gradient(2px 2px at 80% 10%,rgba(0,170,255,.5),transparent),
    radial-gradient(2px 2px at 15% 60%,rgba(255,100,0,.4),transparent);
}
#app{position:relative;z-index:1;display:grid;grid-template-rows:36px 1fr auto 42px;height:100dvh;gap:2px;padding:2px 4px}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:0 8px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(0,50,100,.5),rgba(10,14,26,.8) 50%,rgba(80,10,0,.5))}
.hdr-side{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:3px}
.hdr-side.blue{color:#00aaff} .hdr-side.red{color:#ff4444}
.hdr-center{text-align:center}
h1{font-family:'Orbitron',monospace;font-size:.75rem;font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#00aaff,#fff,#ff4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#round-label{font-family:'Orbitron',monospace;font-size:.52rem;letter-spacing:2px;color:var(--muted)}

/* BATTLEFIELD */
#battlefield{display:grid;grid-template-columns:1fr 180px 1fr;gap:4px;min-height:0}

/* SHIP PANELS */
.player-panel{background:var(--panel);border-radius:8px;border:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.player-panel.human{border-color:#1a3a5a}
.player-panel.ai{border-color:#3a1a1a}
.ship-name{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:3px;padding:3px 8px;flex-shrink:0}
.player-panel.human .ship-name{color:#00aaff;background:linear-gradient(90deg,rgba(0,100,200,.2),transparent);border-bottom:1px solid #1a3a5a}
.player-panel.ai    .ship-name{color:#ff4444;background:linear-gradient(90deg,rgba(180,0,0,.2),transparent);border-bottom:1px solid #3a1a1a;text-align:right}

.ship-img-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;min-height:0}
.ship-img{width:100%;height:100%;object-fit:cover;object-position:center;
  opacity:.85;filter:saturate(1.2) contrast(1.1);transition:filter .4s,opacity .4s}
.player-panel.human .ship-img{transform:scaleX(-1)}

/* hull overlay */
.hull-overlay{position:absolute;bottom:0;left:0;right:0;padding:3px 8px;
  background:linear-gradient(to top,rgba(6,8,16,.95),transparent)}
.hull-label{font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:2px;color:var(--muted);
  margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
/* tower-human / tower-ai: original renderBar sets innerHTML */
#tower-human{font-weight:700;font-size:.7rem;color:#00aaff}
#tower-ai{font-weight:700;font-size:.7rem;color:#ff4444}
.hull-bar-bg{height:5px;background:#111;border-radius:3px;overflow:hidden;border:1px solid #222}
/* bar-human / bar-ai: renderBar sets .width (patched from .height) */
#bar-human{height:100%;border-radius:3px;transition:width .4s ease;
  background:linear-gradient(90deg,#004488,#00aaff);box-shadow:0 0 6px #00aaff55}
#bar-ai{height:100%;border-radius:3px;transition:width .4s ease;
  background:linear-gradient(90deg,#880000,#ff4444);box-shadow:0 0 6px #ff444455}
.tower-bar-fill.danger{background:linear-gradient(90deg,#881100,#ff2200) !important}

/* shield-human / shield-ai: renderBar sets textContent = '🛡 Štít: N' */
#shield-human,#shield-ai{
  position:absolute;top:4px;font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;
  color:#ffcc00;background:rgba(0,0,0,.8);border:1px solid #aa8800;
  border-radius:4px;padding:2px 7px;letter-spacing:1px;
  display:none;white-space:nowrap}
#shield-human{right:6px} #shield-ai{left:6px}

/* resources — original uses .res-row class and ids res-human / res-ai */
.res-row{display:flex;gap:3px;padding:2px 4px;flex-wrap:nowrap;flex-shrink:0;
  background:rgba(0,0,0,.4);border-top:1px solid var(--border);align-items:center}
.player-panel.human .res-row{flex-direction:row;justify-content:flex-start}
.player-panel.ai    .res-row{flex-direction:row-reverse;justify-content:flex-start}
.res-chip{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.68rem;white-space:nowrap}
.res-chip .icon{font-size:.85rem}
.res-chip .prod{color:var(--muted);font-size:.6rem}

/* MIDDLE */
#mid-col{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
#log-wrap{flex:1;background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:6px;
  padding:6px 8px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#222 transparent}
#log-wrap h3{font-family:'Orbitron',monospace;font-size:.48rem;letter-spacing:2px;color:var(--muted);margin-bottom:3px;text-align:center}
#log{display:flex;flex-direction:column;gap:1px}
.log-line{font-size:.72rem;padding:2px 0;border-bottom:1px solid #111;color:var(--text);line-height:1.4}
.log-line.round-sep{color:var(--muted);font-size:.65rem;letter-spacing:2px;padding-top:5px;font-family:'Orbitron',monospace;font-weight:700}
.log-line.good{color:#44aaff}   /* hráč – modrá */
.log-line.bad{color:#ff5555}    /* AI / damage – červená */
.log-line.info{color:#8899bb}   /* neutrální info – šedavá */
.log-line.gold{color:#ffcc00}   /* speciální efekty – zlatá */

#vs-badge{background:var(--border);border-radius:4px;text-align:center;padding:2px;
  font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:1px;color:var(--muted);flex-shrink:0;display:none}
#ai-hand-wrap{background:rgba(60,0,0,.2);border:1px solid #2a1010;border-radius:6px;padding:3px 6px;flex-shrink:0}
#ai-hand-wrap h3{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:2px;color:#e07070;margin-bottom:3px}
#ai-hand-cards{display:flex;flex-wrap:wrap;gap:3px}
.ai-card-chip{background:rgba(180,0,0,.1);border:1px solid #3d1515;border-radius:4px;
  padding:2px 5px;font-size:.62rem;display:flex;align-items:center;gap:3px}
.ai-chip-name{font-weight:700;color:var(--text)}
.ai-chip-cost{color:var(--muted);font-size:.58rem}

/* HAND */
#hand-section{background:rgba(0,20,50,.3);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
#hand-section h3{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:2px;color:var(--muted);margin-bottom:3px}
#hand-cards{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:thin;scrollbar-color:#222 transparent}

/* CARDS — original class names: card, t-attack, t-sabotage, t-buildtower, t-buildshield, t-production, t-special, t-trade */
.card{min-width:95px;max-width:108px;flex-shrink:0;background:#0c1020;border-radius:6px;
  border:1px solid var(--border);cursor:pointer;user-select:none;padding:5px 6px;
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.card.t-attack::before{background:var(--attack)}
.card.t-sabotage::before{background:var(--sabotage)}
.card.t-buildtower::before{background:var(--tower)}
.card.t-buildshield::before{background:var(--shield)}
.card.t-production::before{background:var(--prod)}
.card.t-special::before{background:var(--special)}
.card.t-trade::before{background:var(--trade)}
.card:hover:not(.unaffordable){transform:translateY(-5px);box-shadow:var(--glow)}
.card.unaffordable{opacity:.35;cursor:not-allowed}
.card.selected{transform:translateY(-7px);box-shadow:0 0 0 2px #00aaff,var(--glow)}
.card-icon{font-size:1rem;line-height:1;margin-bottom:2px}
.card-name{font-size:.68rem;font-weight:700;line-height:1.2;margin-bottom:2px}
.card-cost{font-size:.72rem;font-weight:700;margin-bottom:2px}
.card-desc{font-size:.58rem;color:var(--muted);line-height:1.3}

/* ACTION BAR */
#action-bar{display:grid;grid-template-columns:61% auto 1fr;
  align-items:center;gap:6px;padding:3px 8px;
  background:rgba(0,0,0,.7);border-top:1px solid var(--border);border-radius:6px}
#action-hint{font-size:.65rem;color:var(--text);font-family:'Orbitron',monospace;letter-spacing:1px;min-width:0;}
#action-center{display:flex;gap:6px;}
#action-end{display:flex;gap:6px;justify-content:flex-end;}
.btn-endbattle{background:rgba(60,0,0,.7)!important;border:1px solid #ff4444!important;
  color:#ff4444!important;font-size:.55rem!important;padding:5px 10px!important;
  letter-spacing:1px!important;flex-shrink:0;border-radius:5px;}
.btn-endbattle:hover{background:rgba(120,0,0,.85)!important;box-shadow:0 0 10px rgba(255,68,68,.4)!important;}
.btn{font-family:'Orbitron',monospace;font-size:.6rem;letter-spacing:2px;padding:5px 12px;
  border-radius:4px;border:none;cursor:pointer;font-weight:700;text-transform:uppercase;
  white-space:nowrap;transition:filter .15s,transform .1s;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-play{background:linear-gradient(135deg,#003366,#0055aa);color:#00ccff;border:1px solid #0066cc;box-shadow:0 0 10px rgba(0,100,200,.4)}
.btn-discard{background:linear-gradient(135deg,#2a1000,#553300);color:#ff8800;border:1px solid #663300}
.btn-play:hover,.btn-discard:hover{filter:brightness(1.3)}

/* PRODUCTION FLASH */
@keyframes _prod_up   { 0%{background:rgba(40,255,100,.35);box-shadow:0 0 8px rgba(40,255,100,.5)} 100%{background:rgba(255,255,255,.04);box-shadow:none} }
@keyframes _prod_down { 0%{background:rgba(255,50,50,.35); box-shadow:0 0 8px rgba(255,50,50,.5)}  100%{background:rgba(255,255,255,.04);box-shadow:none} }
.res-chip.flash-up   { animation:_prod_up   3s ease-out forwards; }
.res-chip.flash-down { animation:_prod_down 3s ease-out forwards; }

/* FLOATING POPUPS */
@keyframes _popup {
  0%   { opacity:1; }
  75%  { opacity:1; }
  100% { opacity:0; }
}
.fp {
  position:absolute; pointer-events:none; z-index:99;
  font-family:'Orbitron',monospace; font-weight:900; font-size:.8rem;
  text-shadow:0 0 8px currentColor;
  animation:_popup 3s ease-out forwards;
  white-space:nowrap;
}
.fp.pos { color:#44ff88; }
.fp.neg { color:#ff4444; }

/* FULLSCREEN BUTTON */
#btn-fullscreen {
  position:fixed; top:6px; right:8px; z-index:1000;
  background:rgba(0,0,0,.5); border:1px solid #1a2035;
  border-radius:5px; color:#4a6080; font-size:.75rem;
  padding:3px 7px; cursor:pointer; line-height:1;
  transition:color .15s, border-color .15s;
}
#btn-fullscreen:hover { color:#c8d8f0; border-color:#4a6080; }

/* GAME OVER OVERLAY */
#endgame-overlay {
  display:none; position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,.75); backdrop-filter:blur(4px);
  align-items:center; justify-content:center;
}
#endgame-overlay.show { display:flex; }
#endgame-box {
  position:relative; text-align:center;
  border-radius:12px; padding:40px 50px 36px;
  max-width:420px; width:90%;
  animation:_endgame_in .4s cubic-bezier(.2,1.3,.5,1) forwards;
}
@keyframes _endgame_in {
  from { transform:scale(.7); opacity:0; }
  to   { transform:scale(1);  opacity:1; }
}
#endgame-box.win {
  background:linear-gradient(160deg,rgba(0,30,60,.92),rgba(0,60,30,.92));
  border:1px solid #00aaff;
  box-shadow:0 0 40px rgba(0,170,255,.4), inset 0 0 60px rgba(0,50,100,.5);
}
#endgame-box.lose {
  background:linear-gradient(160deg,rgba(60,0,0,.92),rgba(40,10,0,.92));
  border:1px solid #ff4444;
  box-shadow:0 0 40px rgba(255,50,50,.4), inset 0 0 60px rgba(80,0,0,.5);
}
.endgame-stars {
  position:absolute; inset:0; border-radius:12px; overflow:hidden; pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 10% 20%,#fff,transparent),
    radial-gradient(1px 1px at 30% 60%,#aef,transparent),
    radial-gradient(1px 1px at 55% 15%,#fff,transparent),
    radial-gradient(1px 1px at 75% 80%,#fff,transparent),
    radial-gradient(1px 1px at 90% 40%,#ffa,transparent),
    radial-gradient(1px 1px at 20% 85%,#fff,transparent),
    radial-gradient(1px 1px at 65% 50%,#aff,transparent);
}
.endgame-icon { font-size:3.5rem; margin-bottom:12px; line-height:1; }
.endgame-title {
  font-family:'Orbitron',monospace; font-size:1.6rem; font-weight:900;
  letter-spacing:6px; margin-bottom:8px;
}
.win .endgame-title {
  background:linear-gradient(90deg,#00aaff,#fff,#00ffaa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.lose .endgame-title {
  background:linear-gradient(90deg,#ff4444,#ffaa00);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.endgame-subtitle {
  font-family:'Orbitron',monospace; font-size:.6rem; letter-spacing:4px;
  color:var(--muted); margin-bottom:20px;
}
.endgame-msg {
  font-size:.85rem; color:#c8d8f0; line-height:1.6; margin-bottom:24px;
}
.endgame-rounds {
  font-family:'Orbitron',monospace; font-size:.58rem; letter-spacing:3px;
  color:var(--muted); margin-bottom:28px;
}
.endgame-btn {
  font-family:'Orbitron',monospace; font-size:.65rem; letter-spacing:3px;
  padding:10px 28px; border-radius:6px; border:none; cursor:pointer;
  font-weight:700; transition:transform .15s, box-shadow .15s;
}
.win .endgame-btn {
  background:linear-gradient(90deg,#004488,#0088cc);
  color:#fff; box-shadow:0 0 16px rgba(0,170,255,.4);
}
.lose .endgame-btn {
  background:linear-gradient(90deg,#660000,#cc2200);
  color:#fff; box-shadow:0 0 16px rgba(255,50,50,.4);
}
.endgame-btn:hover { transform:scale(1.05); }
.endgame-divider {
  width:60px; height:1px; margin:0 auto 20px;
}
.win .endgame-divider  { background:linear-gradient(90deg,transparent,#00aaff,transparent); }
.lose .endgame-divider { background:linear-gradient(90deg,transparent,#ff4444,transparent); }

/* DAMAGE VISUALS */
@keyframes _fire{0%{transform:translateY(0) scaleX(1);opacity:.9}50%{transform:translateY(-10px) scaleX(1.1);opacity:.55}100%{transform:translateY(-20px) scaleX(.8);opacity:0}}
@keyframes _smoke{0%{transform:translateY(0) scale(1);opacity:.4}100%{transform:translateY(-35px) scale(2);opacity:0}}
@keyframes _flicker{0%,100%{opacity:.85}40%{opacity:.5}75%{opacity:.65}}
@keyframes _pulse{0%,100%{box-shadow:none}50%{box-shadow:inset 0 0 30px rgba(255,60,0,.35)}}
@keyframes _hitflash{0%{opacity:1}100%{opacity:0}}
.player-panel[data-dmg="1"] .ship-img{filter:saturate(1) contrast(1.1)}
.player-panel[data-dmg="2"] .ship-img{filter:saturate(.65) contrast(1.25) brightness(.8)}
.player-panel[data-dmg="3"] .ship-img{filter:saturate(.3) contrast(1.45) brightness(.65);animation:_flicker 1.5s ease-in-out infinite}
.player-panel[data-dmg="4"] .ship-img{filter:saturate(.05) contrast(1.7) brightness(.4);animation:_flicker .55s ease-in-out infinite}
.player-panel[data-dmg="2"]{animation:_pulse 2s ease-in-out infinite}
.player-panel[data-dmg="3"]{animation:_pulse 1s ease-in-out infinite}
.player-panel[data-dmg="4"]{animation:_pulse .4s ease-in-out infinite}
.hit-flash::after{content:'';position:absolute;inset:0;border-radius:8px;
  background:radial-gradient(circle,rgba(255,80,0,.55),transparent 70%);
  animation:_hitflash .4s ease forwards;pointer-events:none}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
</style>
</head>
<body>

let G = {};

function makePlayer(name) {
  return {
    name, tower:20, shield:0,
    e:5, m:5, d:5,
    ep:2, mp:2, dp:2,
    deck:[], hand:[], discard:[]
  };
}

function buildDeck() {
  let d = [...CARDS, ...CARDS];
  for (let i=d.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

function drawCard(p) {
  if (p.deck.length===0) {
    if (p.discard.length===0) return;
    p.deck = [...p.discard]; p.discard=[];
    for(let i=p.deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p.deck[i],p.deck[j]]=[p.deck[j],p.deck[i]];}
    log(`[${p.name}] Zamíchal odpadní balík.`, 'info');
  }
  if (p.deck.length>0) { p.hand.push(p.deck.shift()); }
}

function canPlay(p, c) {
  if (c.type === 'emergency') return p.tower > 1;
  return p.e >= c.cost.e && p.m >= c.cost.m && p.d >= c.cost.d;
}

function initGame() {
  document.getElementById('btn-play').style.display='';
  document.getElementById('btn-discard').style.display='';
  document.getElementById('btn-newgame').style.display='none';
  G = {
    round: 1,
    phase: 'player', // player | ai | end
    selectedIdx: -1,
    discardMode: false,
    human: makePlayer('Hráč'),
    ai:    makePlayer('AI'),
  };
  G.human.deck = buildDeck();
  G.ai.deck    = buildDeck();
  document.getElementById('log').innerHTML = '';
  for(let i=0;i<6;i++){drawCard(G.human);drawCard(G.ai);}
  G.human.e=5;G.human.m=5;G.human.d=5;
  G.ai.e=5;G.ai.m=5;G.ai.d=5;
  startPlayerTurn();
}

function startPlayerTurn() {
  G.phase = 'player';
  G.selectedIdx = -1;
  G.discardMode = false;
  G.human.e += G.human.ep;
  G.human.m += G.human.mp;
  G.human.d += G.human.dp;
  G.ai.e    += G.ai.ep;
  G.ai.m    += G.ai.mp;
  G.ai.d    += G.ai.dp;
  // doplnit ruku na 5 PŘED tvým tahem (po případné sabotáži z minulého kola)
  // — NE zde, doplňuje se až po AI tahu aby trest trval celý hráčův tah
  log(`── KOLO ${G.round} ──`, 'round-sep');
  document.getElementById('round-label').textContent = `KOLO ${G.round}`;
  setHint('Vyber kartu k zahrání nebo zahození.');
  showActionBar('normal');
  render();
}

function actionPlay() {
  if (G.selectedIdx < 0) { setHint('⚠ Nejdřív vyber kartu!'); return; }
  const card = G.human.hand[G.selectedIdx];
  if (!canPlay(G.human, card)) {
    log(`⚠ Nemáš dost plazmy na "${card.name}" — karta zahozena!`, 'bad');
    G.human.hand.splice(G.selectedIdx,1);
    G.human.discard.push(card);
    drawCard(G.human);
    endPlayerTurn();
    return;
  }
  spend(G.human, card);
  G.human.hand.splice(G.selectedIdx,1);
  G.human.discard.push(card);
  applyEffect(card, G.human, G.ai);
  drawCard(G.human);
  endPlayerTurn();
}

function actionDiscard() {
  if (G.selectedIdx < 0) { setHint('⚠ Nejdřív vyber kartu, kterou chceš zahodit!'); return; }
  const card = G.human.hand[G.selectedIdx];
  G.human.hand.splice(G.selectedIdx,1);
  G.human.discard.push(card);
  log(`Zahodil jsi kartu "${card.name}".`, 'info');
  drawCard(G.human);
  endPlayerTurn();
}

function endPlayerTurn() {
  G.selectedIdx = -1;
  if (checkVictory()) return;
  // doplnit ruku na 6 až TEĎ — trest za sabotáž z AI tahu trval celý náš tah
  while (G.human.hand.length < 6) drawCard(G.human);
  render();
  showActionBar('waiting');
  setHint('Tah AI...');
  setTimeout(aiTurn, 900);
}

function aiScore(card, ai, hu) {
  const t = card.type;
  let score = 0;

  // Zakladni skore podle sily karty
  score += card.power * 2;

  // UTOK - cennější když soupeř nemá štít nebo málo HP
  if (t === 'attack') {
    score += 10;
    if (hu.shield === 0) score += 15; // bez štítu je útok efektivnější
    if (hu.tower < 10)  score += 20; // dorazit soupeře
    if (hu.tower > 30)  score -= 5;  // soupeř je silný, raději jiná strategie
  }

  // EMP/BYPASS - cennější když má soupeř velký štít
  if (t === 'attack_emp') {
    score += 8;
    if (hu.shield > 8)  score += 20; // velký štít = bypass se vyplatí
    if (hu.shield === 0) score -= 10; // bez štítu je lepší normální útok
    if (hu.tower < 8)   score += 25; // dorazit soupeře
  }

  // STAVBA LODI - cennější když jsme poškozeni
  if (t === 'build_tower') {
    score += 5;
    if (ai.tower < 5)  score += 35; // kriticky nízko - priorita!
    else if (ai.tower < 10) score += 20;
    else if (ai.tower < 15) score += 10;
    if (ai.tower >= 20) score -= 5;  // upgrade zóna - dražší
    if (hu.tower < 8)   score -= 10; // raději útočit než stavět
  }

  // ŠTÍT - cennější když nemáme štít a soupeř útočí
  if (t === 'build_shield') {
    score += 5;
    if (ai.shield === 0) score += 20;
    else if (ai.shield < 5) score += 10;
    else if (ai.shield > 15) score -= 10; // velký štít nepotřebujeme
    if (hu.tower < 8) score -= 15; // raději dorazit soupeře
  }

  // KRÁDEŽE - cennější když má soupeř hodně zdrojů
  if (t === 'sabotage_res') {
    const huTotal = hu.e + hu.m + hu.d;
    score += 8;
    if (huTotal > 20) score += 15;
    if (huTotal > 40) score += 15;
    if (huTotal < 5)  score -= 15; // soupeř nemá co krást
    // Krást ten zdroj kterého má soupeř nejvíc
    if (card.steal === 'e' && hu.e >= hu.m && hu.e >= hu.d) score += 10;
    if (card.steal === 'm' && hu.m >= hu.e && hu.m >= hu.d) score += 10;
    if (card.steal === 'd' && hu.d >= hu.e && hu.d >= hu.m) score += 10;
  }

  // ZAHAZOVÁNÍ KARET - cennější když má soupeř plnou ruku
  if (t === 'sabotage_dis') {
    score += 6;
    if (hu.hand.length >= 5) score += 15;
    if (hu.hand.length <= 2) score -= 10;
  }

  // SABOTÁŽ PRODUKCE - cennější když má soupeř vysokou produkci
  if (t === 'sabotage_prod' || t === 'sabotage_prod_m' || t === 'sabotage_prod_d') {
    const huProd = hu.ep + hu.mp + hu.dp;
    score += 5;
    if (huProd >= 5) score += 20;
    if (huProd >= 8) score += 15;
    if (huProd <= 2) score -= 15; // nízká produkce - nevyplatí se
    // Sabotovat největší produkci
    if (t === 'sabotage_prod'   && hu.ep >= hu.mp && hu.ep >= hu.dp) score += 10;
    if (t === 'sabotage_prod_m' && hu.mp >= hu.ep && hu.mp >= hu.dp) score += 10;
    if (t === 'sabotage_prod_d' && hu.dp >= hu.ep && hu.dp >= hu.mp) score += 10;
  }

  // PRODUKCE - cennější na začátku hry
  if (t === 'prod_e' || t === 'prod_m' || t === 'prod_d') {
    score += 8;
    if (G.round <= 5)  score += 20; // investice na začátku hry
    if (G.round <= 10) score += 10;
    if (G.round > 20)  score -= 10; // pozdní hra - produkce má menší smysl
    // Zvýšit produkci kde jsme nejslabší
    if (t === 'prod_e' && ai.ep <= ai.mp && ai.ep <= ai.dp) score += 10;
    if (t === 'prod_m' && ai.mp <= ai.ep && ai.mp <= ai.dp) score += 10;
    if (t === 'prod_d' && ai.dp <= ai.ep && ai.dp <= ai.mp) score += 10;
  }

  // SPECIÁLNÍ - quantum redistribution
  if (t === 'special') {
    const huProd = hu.ep + hu.mp + hu.dp;
    score += huProd * 5;
    if (huProd === 0) score = -999; // zbytečné hrát
  }

  // Penalizace za plýtvání zdroji - nehrát pokud jsou zdroje vzácné
  const totalRes = ai.e + ai.m + ai.d;
  if (totalRes < 8) score -= 5;

  return score;
}

function aiTurn() {
  G.phase = 'ai';
  const ai = G.ai, hu = G.human;
  while (ai.hand.length < 6) drawCard(ai);

  // Ohodnotit všechny zahratelné karty a vybrat nejlepší
  const playable = ai.hand.filter(c => canPlay(ai, c));
  let chosen = null;

  if (playable.length > 0) {
    // Seřadit podle skóre, s malou náhodností aby AI nebyla předvídatelná
    const scored = playable.map(c => ({
      card: c,
      score: aiScore(c, ai, hu) + (Math.random() * 6 - 3) // ±3 náhodnost
    }));
    scored.sort((a, b) => b.score - a.score);
    chosen = scored[0].card;
  }
  if (chosen) {
    spend(ai, chosen);
    ai.hand.splice(ai.hand.indexOf(chosen),1);
    ai.discard.push(chosen);
    log(`AI zahrála: ${TYPE_META[chosen.type].icon} ${chosen.name}`, 'info');
    applyEffect(chosen, ai, hu);
  } else {
    // zahodit nejdražší NEzahratelnou kartu — Emergency nikdy nezahazovat pokud má hvězdná loď > 1
    if(ai.hand.length>0){
      const unplayable = ai.hand.filter(c => c.type==='emergency' ? false : !canPlay(ai,c));
      const disc = (unplayable.length > 0 ? unplayable : ai.hand)
        .sort((a,b)=>costVal(b)-costVal(a))[0];
      ai.hand.splice(ai.hand.indexOf(disc),1);
      ai.discard.push(disc);
      log(`  ▶ AI zahodila: ${disc.name}`, 'info');
    }
  }
  if(checkVictory()) return;
  G.round++;
  startPlayerTurn();
}

function spend(p, c) {
  if(c.cost.e > 0) trackRes(p, 'e', -c.cost.e);
  else p.e -= c.cost.e;
  if(c.cost.m > 0) trackRes(p, 'm', -c.cost.m);
  else p.m -= c.cost.m;
  if(c.cost.d > 0) trackRes(p, 'd', -c.cost.d);
  else p.d -= c.cost.d;
}

function applyEffect(card, self, enemy) {
  const t = card.type;
  if (t==='attack'||t==='attack_emp') {
    let dmg = card.power;
    if(t==='attack' && enemy.shield>0){
      const abs = Math.min(enemy.shield, dmg);
      enemy.shield -= abs; dmg -= abs;
      if(abs>0) log(`  Štít absorboval ${abs} — zbývá štít: ${enemy.shield}.`,'info');
    } else if(t==='attack_emp') {
      log(`  EMP ignoruje štít!`,'gold');
    }
    enemy.tower -= dmg;
    enemy.tower = Math.max(0, enemy.tower);
    if(dmg>0) log(`  ${enemy.name} přišel o ${dmg} bodů lodi → ${enemy.tower}/50.`,'bad');
  } else if(t==='sabotage_res'){
    const key = card.steal;
    const amt = Math.min(card.power, enemy[key]);
    trackRes(enemy, key, -amt);
    trackRes(self,  key, +amt);
    const n = key==='e'?'energie':key==='m'?'plazmy':'dat';
    log(`  Ukradeno ${amt} ${n} od ${enemy.name}.`,'good');
  } else if(t==='sabotage_dis'){
    let disc=0;
    for(let i=0;i<card.power&&enemy.hand.length>0;i++){
      const idx=Math.floor(Math.random()*enemy.hand.length);
      const lost=enemy.hand.splice(idx,1)[0];
      enemy.discard.push(lost);
      log(`  💥 ${self.name} vyhodil z ruky ${enemy.name}: "${lost.name}".`,'bad'); disc++;
    }
    if(!disc) log(`  ${enemy.name} nemá karty.`,'info');
  } else if(t==='sabotage_prod'){
    enemy.ep = Math.max(0, enemy.ep - card.power);
    log(`  ${enemy.name}: produkce energie -${card.power} → ${enemy.ep}/kolo.`,'bad');
  } else if(t==='sabotage_prod_m'){
    enemy.mp = Math.max(0, enemy.mp - card.power);
    log(`  ${enemy.name}: produkce plazmy -${card.power} → ${enemy.mp}/kolo.`,'bad');
  } else if(t==='sabotage_prod_d'){
    enemy.dp = Math.max(0, enemy.dp - card.power);
    log(`  ${enemy.name}: produkce dat -${card.power} → ${enemy.dp}/kolo.`,'bad');
  } else if(t==='build_tower'){
    self.tower = Math.min(50, self.tower + card.power);
    log(`  ${self.name} přidal ${card.power} pater lodi → ${self.tower}/50.`,'good');
  } else if(t==='build_shield'){
    self.shield += card.power;
    log(`  ${self.name} získal +${card.power} štítu → celkem ${self.shield}.`,'good');
  } else if(t==='prod_e'){
    self.ep += card.power;
    log(`  ${self.name}: produkce energie +${card.power} → ${self.ep}/kolo.`,'good');
  } else if(t==='prod_m'){
    self.mp += card.power;
    log(`  ${self.name}: produkce plazmy +${card.power} → ${self.mp}/kolo.`,'good');
  } else if(t==='prod_d'){
    self.dp += card.power;
    log(`  ${self.name}: produkce dat +${card.power} → ${self.dp}/kolo.`,'good');
  } else if(t==='special'){
    let stolen=0;
    if(enemy.ep>0){enemy.ep--;self.ep++;stolen++;}
    if(enemy.mp>0){enemy.mp--;self.mp++;stolen++;}
    if(enemy.dp>0){enemy.dp--;self.dp++;stolen++;}
    if(stolen===0) log(`  Quantum Redistribution — soupeř má vše na 0, žádný efekt.`,'info');
    else log(`  ✨ Quantum Redistribution! Ukradeno ${stolen}/3 produkcí. Tvoje produkce: ⚡${self.ep} 🧪${self.mp} 💾${self.dp}`,'gold');
  } else if(t.startsWith('trade_')){
    const from = t[6], to = t[7];
    const icons = {e:'⚡', m:'🧪', d:'💾'};
    self[to] += card.power;
    log(`  ${self.name} přeměnil 4${icons[from]} → 4${icons[to]}.`,'good');
  } else if(t==='emergency'){
    const loss = Math.ceil(self.tower / 2);
    self.tower = Math.max(0, self.tower - loss);
    self.e += card.power;
    self.m += card.power;
    self.d += card.power;
    log(`  🆘 Emergency Protocol! Hvězdná loď -${loss} → ${self.tower}/50. Získáno +${card.power}⚡ +${card.power}🧪 +${card.power}💾.`,'gold');
  }
}

function isEconomicallyDead(p) {
  // Všechny produkce na 0 a žádná surovina nedosahuje min. ceny karty (2)
  const noIncome = p.ep === 0 && p.mp === 0 && p.dp === 0;
  const noResources = p.e < 2 && p.m < 2 && p.d < 2;
  return noIncome && noResources;
}

function checkVictory() {
  const h=G.human, a=G.ai;
  if(h.tower<=0)   { endGame('AI',   'AI zničila tvoji loď!'); return true; }
  if(h.tower>=50)  { endGame('Hráč', 'Dosáhl jsi plného upgradu lodi! 🏆'); return true; }
  if(a.tower<=0)   { endGame('Hráč', 'Zničil jsi loď AI!'); return true; }
  if(a.tower>=50)  { endGame('AI',   'AI dosáhla plného upgradu lodi!'); return true; }
  if(isEconomicallyDead(h)) { endGame('AI',   'Ekonomický kolaps! Tvoje loď nemá zdroje na boj.'); return true; }
  if(isEconomicallyDead(a)) { endGame('Hráč', 'Ekonomický kolaps AI! Nepřítel vyčerpal všechny zdroje. 🏆'); return true; }
  return false;
}

function endGame(winner, msg) {
  G.phase='end';
  const win = winner==='Hráč';
  document.getElementById('btn-play').style.display='none';
  document.getElementById('btn-discard').style.display='none';
  document.getElementById('btn-newgame').style.display='';
  document.getElementById('btn-nextgame').style.display='';
  document.getElementById('btn-endbattle').style.display='none';
  // Update score
  if(winner==='Hráč') { G._scoreHuman = (G._scoreHuman||0)+1; }
  else { G._scoreAI = (G._scoreAI||0)+1; }
  document.getElementById('score-human').textContent = G._scoreHuman||0;
  document.getElementById('score-ai').textContent = G._scoreAI||0;
  setHint((win ? '🏆 VYHRÁL JSI! ' : '💀 PROHRÁL JSI! ') + msg + ` (kolo ${G.round})`);
  render();

  // Zobrazit endgame overlay
  const box = document.getElementById('endgame-box');
  box.className = win ? 'win' : 'lose';
  const isEcon = msg.includes('kolaps');
  document.getElementById('endgame-icon').textContent   = win ? (isEcon ? '💸' : '🏆') : (isEcon ? '💸' : '💀');
  document.getElementById('endgame-title').textContent  = win ? 'VÍTĚZSTVÍ' : 'PORÁŽKA';
  document.getElementById('endgame-subtitle').textContent = isEcon
    ? (win ? '— ECONOMIC DOMINANCE —' : '— ECONOMIC COLLAPSE —')
    : (win ? '— FEDERATION TRIUMPHANT —' : '— DOMINION PREVAILS —');
  document.getElementById('endgame-msg').textContent    = msg;
  document.getElementById('endgame-rounds').textContent = `KOLO ${G.round} · KLIKNI PRO ZAVŘENÍ`;
  document.getElementById('endgame-overlay').classList.add('show');
}

let _popupCounter = 0;
function showPopup(anchorId, value, isPercent) {
  const anchor = document.getElementById(anchorId);
  if (!anchor) return;
  const rect = anchor.getBoundingClientRect();
  const appRect = document.getElementById('app').getBoundingClientRect();

  const el = document.createElement('div');
  el.className = 'fp ' + (value >= 0 ? 'pos' : 'neg');
  el.textContent = (value >= 0 ? '+' : '') + value;

  // Offset aby se neprekryvaly - stridame levo/pravo
  const offsets = [-22, 22, -44, 44, 0];
  const xOff = offsets[_popupCounter % offsets.length];
  _popupCounter++;
  setTimeout(() => { _popupCounter = Math.max(0, _popupCounter - 1); }, 3200);

  el.style.left = (rect.left - appRect.left + rect.width/2 - 16 + xOff) + 'px';
  el.style.top  = (rect.top  - appRect.top  - 10) + 'px';

  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

// ── SHIP/UPGRADE SYSTEM ─────────────────────────────────────
// Je hráč v upgrade zóně? (tower > 20)
function isUpgrading(p) { return p.tower > 20; }

// Effective cost pro build_tower kartu (o 1 dražší v upgrade zóně)
function buildCost(p, card) {
  if (card.type !== 'build_tower') return card.cost;
  const extra = isUpgrading(p) ? 1 : 0;
  return { e: card.cost.e, m: card.cost.m + extra, d: card.cost.d };
}

// Přepíšeme canPlay aby zohlednil upgrade cenu
const _origCanPlay = canPlay;
canPlay = function(p, c) {
  if (c.type === 'emergency') return p.tower > 1;
  const cost = buildCost(p, c);
  return p.e >= cost.e && p.m >= cost.m && p.d >= cost.d;
};

// Přepíšeme spend aby odečetl správnou cenu
const _origSpend = spend;
spend = function(p, c) {
  const cost = buildCost(p, c);
  p.e -= cost.e; p.m -= cost.m; p.d -= cost.d;
};

// Přepíšeme renderBar – dvoubarevný bar + dynamický label
const _origRenderBar = renderBar;
renderBar = function(p, barId, numId, shieldId) {
  // Hull bar: 0-20 = první zóna (40% šířky baru), 21-50 = druhá zóna
  const bar = document.getElementById(barId);
  const isHuman = barId === 'bar-human';

  const hullPct   = Math.max(0, Math.min(40, p.tower / 20 * 40));    // 0–40% pro hull zónu
  const upgradePct = p.tower > 20 ? ((p.tower - 20) / 30 * 60) : 0; // 0–60% pro upgrade zónu
  const totalPct = hullPct + upgradePct;

  // Barva: červená danger < 10, normální hull barva, zlatá pokud upgrade
  let grad;
  if (p.tower <= 10) {
    grad = isHuman
      ? 'linear-gradient(90deg,#550000,#ff2200)'
      : 'linear-gradient(90deg,#550000,#ff2200)';
  } else if (p.tower <= 20) {
    grad = isHuman
      ? 'linear-gradient(90deg,#004488,#00aaff)'
      : 'linear-gradient(90deg,#880000,#ff4444)';
  } else {
    // upgrade zóna – gradient přechází z hull barvy do zlaté
    grad = isHuman
      ? 'linear-gradient(90deg,#004488 0%,#00aaff 40%,#cc8800 41%,#ffcc00 100%)'
      : 'linear-gradient(90deg,#880000 0%,#ff4444 40%,#cc8800 41%,#ffcc00 100%)';
  }
  bar.style.width = totalPct + '%';
  bar.style.background = grad;
  bar.style.boxShadow = p.tower > 20
    ? '0 0 8px rgba(255,200,0,.6)'
    : isHuman ? '0 0 6px #00aaff55' : '0 0 6px #ff444455';

  // Label: dynamický
  const numEl = document.getElementById(numId);
  if (p.tower <= 20) {
    numEl.innerHTML = `SHIP <strong>${p.tower}</strong><span style="font-size:.55rem;color:var(--muted)">/20</span>`;
  } else {
    const upg = p.tower - 20;
    numEl.innerHTML = `<span style="color:#ffcc00;font-size:.6rem">UPG</span> <strong style="color:#ffcc00">${upg}</strong><span style="font-size:.55rem;color:var(--muted)">/30</span>`;
  }

  // Shield badge
  const shieldEl = document.getElementById(shieldId);
  if (shieldEl) {
    shieldEl.textContent = p.shield > 0 ? `🛡 ${p.shield}` : '';
    shieldEl.style.display = p.shield > 0 ? 'block' : 'none';
  }
};

// Patch log() to use faction-based colors

  // reclassify based on message content
  let newCls = cls;
  const m = msg.toLowerCase();

  if (cls === '' || cls === 'info') {
    // AI actions -> bad (red)
    if (msg.startsWith('AI zahrála') || msg.startsWith('  ▶ AI')) newCls = 'bad';
    // Player actions -> good (blue)
    else if (msg.startsWith('Zahodil jsi') || msg.startsWith('⚠')) newCls = 'good';
    // Neutral info (shield absorbed, reshuffle, card effects) -> info
    else newCls = 'info';
  }
  if (cls === 'good') {
    // check if message is about AI benefiting -> bad
    if (m.includes('ai získal') || m.includes('ai přidal') || m.includes('ai: produkce')) newCls = 'bad';
    // player benefit -> good (blue) - keep
  }
  if (cls === 'bad') {
    // damage to player -> bad (red)  
    // damage to AI (player attack hit) -> good (blue)
    if (m.includes('ai přišel') || m.includes('ai: produkce')) newCls = 'good';
  }
  _origLog(msg, newCls);
};

let _ac=null;
function _ctx(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function _tone(type,f1,f2,dur,vol){try{const c=_ctx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(f1,c.currentTime);o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.start();o.stop(c.currentTime+dur+.05);}catch(e){}}
function _noise(dur,vol,fq){try{const c=_ctx(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;const g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start();s.stop(c.currentTime+dur);}catch(e){}}

// ── GLOBÁLNÍ FLASH FRONTA ────────────────────────────────────
const _flashQueue = [];
function flashProd(resId, type, delta) {
  _flashQueue.push({resId, type, delta});
}
function _applyFlashQueue() {
  while (_flashQueue.length > 0) {
    const {resId, type, delta} = _flashQueue.shift();
    const el = document.getElementById(resId);
    if (!el) continue;
    // AI má chipy v DOM obráceně (d,m,e) kvůli reverse() patchi
    const isAI = resId === 'res-ai';
    const idx = isAI
      ? (type==='d' ? 0 : type==='m' ? 1 : 2)
      : (type==='e' ? 0 : type==='m' ? 1 : 2);
    const chip = el.querySelectorAll('.res-chip')[idx];
    if (!chip) continue;
    chip.classList.remove('flash-up','flash-down');
    void chip.offsetWidth;
    chip.classList.add(delta > 0 ? 'flash-up' : 'flash-down');
  }
}

const _origApply = applyEffect;
applyEffect = function(card, self, enemy) {
  const t=card.type;
  if(t==='attack'){_tone('sawtooth',180,70,.25,.3);_noise(.15,.15,400);}
  if(t==='attack_emp'){_tone('square',800,50,.4,.3);_noise(.25,.2,200);}
  if(t==='build_tower'){_tone('sine',400,700,.2,.2);}
  if(t==='build_shield'){_tone('sine',600,900,.15,.2);}
  if(t.startsWith('sabotage')){_tone('square',300,130,.2,.22);}

  // Snapshot před efektem
  const isHuman = self === G.human;
  const isEnemy = enemy === G.human;
  const pre = {
    sTower: self.tower,   eTower: enemy.tower,
    sShield: self.shield, eShield: enemy.shield,
    sE: self.e, sM: self.m, sD: self.d,
    eE: enemy.e, eM: enemy.m, eD: enemy.d,
    sEp: self.ep, sMp: self.mp, sDp: self.dp,
    eEp: enemy.ep, eMp: enemy.mp, eDp: enemy.dp,
  };

  _origApply(card, self, enemy);

  // Popup hull
  const dSTower = self.tower - pre.sTower;
  const dETower = enemy.tower - pre.eTower;
  if (dSTower !== 0) popupPlayer(isHuman, dSTower);
  if (dETower !== 0) popupPlayer(!isHuman, dETower);

  // Popup štít
  const dSShield = self.shield - pre.sShield;
  const dEShield = enemy.shield - pre.eShield;
  if (dSShield !== 0) popupShield(isHuman, dSShield);
  if (dEShield !== 0) popupShield(!isHuman, dEShield);

  // Popup plazmyy self
  const dSE = self.e - pre.sE, dSM = self.m - pre.sM, dSD = self.d - pre.sD;
  if (dSE !== 0) showResPopup(isHuman ? 'res-human' : 'res-ai', 'e', dSE);
  if (dSM !== 0) showResPopup(isHuman ? 'res-human' : 'res-ai', 'm', dSM);
  if (dSD !== 0) showResPopup(isHuman ? 'res-human' : 'res-ai', 'd', dSD);

  // Popup plazmy enemy
  const dEE = enemy.e - pre.eE, dEM = enemy.m - pre.eM, dED = enemy.d - pre.eD;
  if (dEE !== 0) showResPopup(!isHuman ? 'res-human' : 'res-ai', 'e', dEE);
  if (dEM !== 0) showResPopup(!isHuman ? 'res-human' : 'res-ai', 'm', dEM);
  if (dED !== 0) showResPopup(!isHuman ? 'res-human' : 'res-ai', 'd', dED);

  // Flash produkce – volá globální flashProd
  const dSEp = self.ep - pre.sEp, dSMp = self.mp - pre.sMp, dSDp = self.dp - pre.sDp;
  if (dSEp !== 0) flashProd(isHuman ? 'res-human' : 'res-ai', 'e', dSEp);
  if (dSMp !== 0) flashProd(isHuman ? 'res-human' : 'res-ai', 'm', dSMp);
  if (dSDp !== 0) flashProd(isHuman ? 'res-human' : 'res-ai', 'd', dSDp);

  const dEEp = enemy.ep - pre.eEp, dEMp = enemy.mp - pre.eMp, dEDp = enemy.dp - pre.eDp;
  if (dEEp !== 0) flashProd(!isHuman ? 'res-human' : 'res-ai', 'e', dEEp);
  if (dEMp !== 0) flashProd(!isHuman ? 'res-human' : 'res-ai', 'm', dEMp);
  if (dEDp !== 0) flashProd(!isHuman ? 'res-human' : 'res-ai', 'd', dEDp);

  if(t==='attack'||t==='attack_emp'){
    const pid=enemy===G.human?'panel-human':'panel-ai';
    const el=document.getElementById(pid);
    el.classList.remove('hit-flash');void el.offsetWidth;el.classList.add('hit-flash');
    setTimeout(()=>el.classList.remove('hit-flash'),450);
  }
};

function _dmgLevel(h){return h>=20?0:h>=14?1:h>=8?2:h>=3?3:4;}
function _buildFire(n){
  let s='<div style="position:absolute;bottom:15%;width:100%;height:55%;display:flex;justify-content:space-around;align-items:flex-end">';
  for(let i=0;i<n;i++){const dur=(.5+Math.random()*.8).toFixed(2),del=(Math.random()*1.2).toFixed(2),sz=7+Math.random()*13,col=Math.random()>.5?'#ff4400':'#ff8800';s+=`<div style="width:${sz}px;height:${sz*1.7}px;border-radius:50% 50% 20% 20%;background:radial-gradient(ellipse at bottom,${col},transparent);animation:_fire ${dur}s linear -${del}s infinite;filter:blur(2px)"></div>`;}
  for(let i=0;i<Math.ceil(n/2);i++){const l=(10+Math.random()*80).toFixed(0),dur=(1+Math.random()*1.4).toFixed(2),del=(Math.random()*2).toFixed(2),sz=18+Math.random()*28;s+=`<div style="position:absolute;left:${l}%;bottom:20%;width:${sz}px;height:${sz}px;border-radius:50%;background:radial-gradient(circle,rgba(70,70,70,.55),transparent);animation:_smoke ${dur}s ease-out -${del}s infinite;filter:blur(5px)"></div>`;}

}
function _updateDmg(panelId,hull){
  const panel=document.getElementById(panelId);
  const lvl=_dmgLevel(hull);
  panel.dataset.dmg=lvl;
  let ov=panel.querySelector('._ov');
  if(!ov){ov=document.createElement('div');ov.className='_ov';ov.style.cssText='position:absolute;inset:0;pointer-events:none;border-radius:8px;overflow:hidden;';panel.querySelector('.ship-img-wrap').appendChild(ov);}
  ov.innerHTML=lvl>0?_buildFire([0,2,5,9,14][lvl]):'';
}

  _origRender();

  if (typeof _applyFlashQueue === 'function') _applyFlashQueue();
};

// ═══════════════════════════════════════════════════
//  MAIN MENU
// ═══════════════════════════════════════════════════

function initMenuCanvas() {
  const canvas = document.getElementById('menu-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, stars, ships, shots;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeStars() {
    stars = Array.from({length:180}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.5+.2,
      a: Math.random(), da: (Math.random()-.5)*.008
    }));
  }

  function makeShips() {
    ships = [
      { x:W*.22, y:H*.48, vx:.15, color:'#00aaff', dir:1, w:60, h:18 },
      { x:W*.78, y:H*.52, vx:-.15, color:'#ff4444', dir:-1, w:60, h:18 }
    ];
    shots = [];
  }

  function drawShip(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(s.dir, 1);
    // Trup
    ctx.beginPath();
    ctx.moveTo(s.w/2, 0);
    ctx.lineTo(-s.w/2, -s.h/2);
    ctx.lineTo(-s.w/3, 0);
    ctx.lineTo(-s.w/2, s.h/2);
    ctx.closePath();
    ctx.fillStyle = s.color + '22';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.5;
    ctx.fill(); ctx.stroke();
    // Engine glow
    ctx.beginPath();
    ctx.arc(-s.w/2+4, 0, 5, 0, Math.PI*2);
    ctx.fillStyle = s.color + '66';
    ctx.fill();
    ctx.restore();
  }

  let frame = 0;
  function loop() {
    if (!document.getElementById('main-menu') ||
        document.getElementById('main-menu').style.display === 'none') return;

    ctx.clearRect(0,0,W,H);
    // Gradient pozadi
    const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);
    grad.addColorStop(0,'#0a0e1a');
    grad.addColorStop(1,'#060810');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // Hvezdy
    stars.forEach(s => {
      s.a += s.da;
      if(s.a>1||s.a<0) s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(200,220,255,${s.a})`;
      ctx.fill();
    });

    // Lode
    ships.forEach(s => {
      s.x += s.vx;
      if(s.x > W+80) s.x = -80;
      if(s.x < -80) s.x = W+80;
      // Glow
      ctx.save();
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 20;
      drawShip(s);
      ctx.restore();
    });

    // Strely - kazdych 80 framu
    if(frame % 80 === 0) {
      ships.forEach(s => {
        shots.push({ x:s.x, y:s.y, vx:s.dir*4, color:s.color, a:1 });
      });
    }
    shots = shots.filter(sh => sh.a > 0);
    shots.forEach(sh => {
      sh.x += sh.vx; sh.a -= .012;
      ctx.save();
      ctx.globalAlpha = sh.a;
      ctx.shadowColor = sh.color; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-sh.vx*6,sh.y);
      ctx.strokeStyle = sh.color; ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    });

    frame++;
    requestAnimationFrame(loop);
  }

  resize();
  makeStars();
  makeShips();
  window.addEventListener('resize', ()=>{ resize(); makeStars(); makeShips(); });
  loop();
}

function showMenu() {
  const menu = document.getElementById('main-menu');

}
